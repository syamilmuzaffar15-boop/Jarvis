<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis - Zero Button Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #020804;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            cursor: pointer;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.8);
        }

        .jarvis-container {
            position: relative;
            width: 240px;
            height: 240px;
            border: 2px dashed rgba(0, 255, 102, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.3), inset 0 0 20px rgba(0, 255, 102, 0.2);
            background: radial-gradient(circle, rgba(0, 25, 10, 0.9) 0%, rgba(1, 8, 3, 0.95) 100%);
            margin-bottom: 25px;
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
            100% { box-shadow: 0 0 40px rgba(0, 255, 102, 0.6); }
        }

        .face {
            position: relative;
            width: 130px;
            height: 85px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .eye-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            width: 38px;
            height: 4px;
            background-color: #00ff66;
            border-radius: 2px;
            margin-bottom: 8px;
            box-shadow: 0 0 8px #00ff66;
        }

        .eye {
            width: 28px;
            height: 13px;
            background-color: #00ff66;
            border-radius: 6px;
            box-shadow: 0 0 12px #00ff66;
        }

        .mouth {
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 5px;
            background-color: #00ff66;
            border-radius: 3px;
            box-shadow: 0 0 10px #00ff66;
        }

        #status {
            font-size: 0.85rem;
            color: #00cc55;
            margin-bottom: 12px;
            height: 20px;
            text-shadow: 0 0 5px rgba(0,255,102,0.5);
            letter-spacing: 1px;
            text-align: center;
            width: 90%;
        }

        #response-box {
            width: 85%;
            max-width: 450px;
            background: rgba(0, 15, 5, 0.85);
            border: 1px solid rgba(0, 255, 102, 0.5);
            padding: 12px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.95rem;
            min-height: 40px;
            max-height: 90px;
            overflow-y: auto;
            box-shadow: inset 0 0 15px rgba(0,255,102,0.15);
        }

        .footer-credit {
            position: absolute;
            bottom: 12px;
            font-size: 0.75rem;
            color: #00aa44;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.3);
        }

        #appPopup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 650px;
            height: 65vh;
            background: rgba(1, 15, 5, 0.95);
            border: 2px solid #00ff66;
            border-radius: 12px;
            z-index: 100;
            box-shadow: 0 0 35px rgba(0, 255, 102, 0.6);
            flex-direction: column;
            overflow: hidden;
        }

        .popup-header {
            background: #003311;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00ff66;
            font-size: 0.85rem;
        }

        .close-btn {
            background: #ff3333;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.75rem;
        }

        #popupFrame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .speaking .mouth {
            animation: moveMouth 0.2s infinite alternate;
            background-color: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }
        @keyframes moveMouth {
            0% { height: 6px; width: 35px; }
            100% { height: 20px; width: 24px; }
        }

        .speaking .eye {
            animation: blinkEye 0.25s infinite alternate;
            background-color: #ffffff;
            box-shadow: 0 0 15px #ffffff;
        }
        @keyframes blinkEye {
            0% { height: 13px; }
            100% { height: 5px; }
        }
    </style>
</head>
<body onclick="aktifkanModeSuara()">

    <canvas id="matrixCanvas"></canvas>

    <h1>JARVIS</h1>
    
    <div class="jarvis-container" id="jarvisFace">
        <div class="face">
            <div class="eye-container">
                <div class="eyebrow" id="leftEyebrow"></div>
                <div class="eye" id="leftEye"></div>
            </div>
            <div class="eye-container">
                <div class="eyebrow" id="rightEyebrow"></div>
                <div class="eye" id="rightEye"></div>
            </div>
            <div class="mouth" id="mouth"></div>
        </div>
    </div>

    <div id="status">Sentuh / Klik di mana saja untuk mengaktifkan Jarvis...</div>
    <div id="response-box">Selamat Datang Di Jarvis</div>

    <div id="appPopup" onclick="event.stopPropagation()">
        <div class="popup-header">
            <span id="popupTitle">Jendela Aplikasi</span>
            <button class="close-btn" onclick="tutupPopup()">Tutup [X]</button>
        </div>
        <iframe id="popupFrame" src=""></iframe>
    </div>

    <div class="footer-credit">@Create By Samil</div>

    <script>
        let voices = [];
        let recognition = null;
        let isAutoListening = false;
        let isSpeaking = false;

        function muatSuara() {
            voices = window.speechSynthesis.getVoices();
        }
        window.speechSynthesis.onvoiceschanged = muatSuara;
        muatSuara();

        window.addEventListener('load', function() {
            setTimeout(function() {
                bicara("Selamat Datang Di Jarvis, Tuan Samil. Silakan sentuh layar untuk mulai mengontrol dengan suara.");
            }, 800);
        });

        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const letters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
        const fontSize = 14;
        let columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) { drops[x] = 1; }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(2, 8, 4, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        const statusText = document.getElementById('status');
        const responseBox = document.getElementById('response-box');
        const jarvisFace = document.getElementById('jarvisFace');
        const appPopup = document.getElementById('appPopup');
        const popupFrame = document.getElementById('popupFrame');
        const popupTitle = document.getElementById('popupTitle');

        function bicara(teks, callback) {
            const synth = window.speechSynthesis;
            synth.cancel();
            isSpeaking = true;
            
            const utterThis = new SpeechSynthesisUtterance(teks);
            let selectedVoice = voices.find(v => v.lang.includes('id-ID') || v.lang.includes('id_ID'));
            if (selectedVoice) { utterThis.voice = selectedVoice; }
            
            utterThis.lang = 'id-ID';
            utterThis.rate = 0.85; 
            utterThis.pitch = 0.9; 
            
            utterThis.onstart = () => jarvisFace.classList.add('speaking');
            utterThis.onend = () => {
                jarvisFace.classList.remove('speaking');
                isSpeaking = false;
                if (callback) callback();
                if (isAutoListening) { setTimeout(jalankanPendengaran, 300); }
            };
            synth.speak(utterThis);
        }

        function aktifkanModeSuara() {
            if (isAutoListening) return;
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert('Browser tidak mendukung pengenalan suara.'); return; }
            
            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'id-ID';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onresult = (event) => {
                    const hasil = event.results[0][0].transcript;
                    statusText.innerText = "Mendengar: " + hasil;
                    prosesPintar(hasil);
                };

                recognition.onerror = () => {
                    if (isAutoListening && !isSpeaking) { setTimeout(jalankanPendengaran, 500); }
                };

                recognition.onend = () => {
                    if (isAutoListening && !isSpeaking) { setTimeout(jalankanPendengaran, 300); }
                };
            }

            isAutoListening = true;
            statusText.innerText = "Sistem Aktif. Silakan bicara...";
            bicara("Mode suara otomatis diaktifkan, Tuan Samil.", () => jalankanPendengaran());
        }

        function jalankanPendengaran() {
            if (!isAutoListening || isSpeaking) return;
            try { recognition.start(); } catch (e) {}
        }

        function tutupPopup() {
            appPopup.style.display = 'none';
            popupFrame.src = '';
            const v = document.getElementById('kameraView');
            if(v) v.remove();
            bicara("Jendela aplikasi telah ditutup, Tuan.");
        }

        function prosesPintar(pesan) {
            statusText.innerText = "Menganalisis...";
            responseBox.innerText = pesan;
            const p = pesan.toLowerCase();
            let jawaban = "";

            if (p.includes('tutup') || p.includes('kembali')) {
                tutupPopup();
                return;
            }

            if (p.includes('buka kamera')) {
                jawaban = "Membuka kamera sistem, Tuan.";
                appPopup.style.display = 'flex';
                popupTitle.innerText = "Kamera Sistem";
                popupFrame.style.display = "none";
                const video = document.createElement('video');
                video.id = "kameraView";
                video.autoplay = true;
                video.style.width = "100%";
                video.style.height = "100%";
                appPopup.appendChild(video);
                navigator.mediaDevices.getUserMedia({video: true}).then(s => video.srcObject = s).catch(() => {});
            } 
            else if (p.includes('siapa kamu')) { 
                jawaban = "Saya Jarvis, asisten AI pribadi Anda, Tuan Samil."; 
            }
            else if (p.includes('jam berapa')) { 
                jawaban = "Sekarang jam " + new Date().toLocaleTimeString(); 
            }
            // Perhitungan Matematika Otomatis
            else if (/^[\d\s\+\-\*\/\(\)]+$/.test(p.replace(/berapa/g, '').replace(/hasil dari/g, '').trim())) {
                try {
                    let bersih = p.replace(/berapa/g, '').replace(/hasil dari/g, '').trim();
                    let hasilMath = eval(bersih);
                    jawaban = "Hasil dari " + bersih + " adalah " + hasilMath;
                } catch(e) {
                    jawaban = "Maaf Tuan, saya tidak bisa menghitung rumus tersebut.";
                }
            }
            // Perintah Buka Google atau Cari Sesuatu (Ditampilkan di Popup Tanpa Pindah Tab)
            else if (p.includes('buka google')) {
                appPopup.style.display = 'flex';
                popupTitle.innerText = "Google Browser";
                popupFrame.style.display = "block";
                const v = document.getElementById('kameraView'); if(v) v.remove();
                popupFrame.src = "https://www.bing.com"; // Menggunakan Bing agar bisa tampil di iframe tanpa diblokir Google
                jawaban = "Membuka Google di jendela sistem, Tuan.";
            }
            else if (p.startsWith('cari ') || p.startsWith('buka ')) {
                let q = pesan.replace(/^(cari|buka)\s+/i, '');
                appPopup.style.display = 'flex';
                popupTitle.innerText = "Pencarian: " + q;
                popupFrame.style.display = "block";
                const v = document.getElementById('kameraView'); if(v) v.remove();
                popupFrame.src = "https://www.bing.com/search?q=" + encodeURIComponent(q);
                jawaban = "Mencari " + q + " untuk Anda, Tuan.";
            }
            else if (p.includes('stop') || p.includes('berhenti')) {
                isAutoListening = false;
                if (recognition) { try { recognition.stop(); } catch(e) {} }
                jawaban = "Sistem pendengaran dimatikan.";
            }
            else {
                // Pertanyaan umum lainnya akan langsung dibuka sebagai pencarian di jendela popup Jarvis
                appPopup.style.display = 'flex';
                popupTitle.innerText = "Pencarian Web";
                popupFrame.style.display = "block";
                const v = document.getElementById('kameraView'); if(v) v.remove();
                popupFrame.src = "https://www.bing.com/search?q=" + encodeURIComponent(pesan);
                jawaban = "Mencari " + pesan + " di sistem, Tuan.";
            }

            setTimeout(() => {
                responseBox.innerText = jawaban;
                bicara(jawaban);
            }, 50);
        }
    </script>
</body>
</html>
